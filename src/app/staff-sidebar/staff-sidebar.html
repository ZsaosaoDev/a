<div class="sidebar-wrapper" [class.is-closing]="isClosing">
  <div class="overlay" (click)="onClose()"></div>

  <div class="sidebar-container">
    <div
      class="sidebar-header"
      style="display: flex; align-items: center; justify-content: space-between"
    >
      <h2 style="margin: 0; font-size: 1.25rem">Thông tin nhân viên</h2>

      <div style="display: flex; gap: 8px; align-items: center">
        <button
          class="close-btn"
          (click)="onClose()"
          style="background: none; border: none; font-size: 20px; cursor: pointer"
        >
          &times;
        </button>
      </div>
    </div>

    <div class="sidebar-body">
      <div *ngIf="loading" style="text-align: center; padding: 20px">Đang tải...</div>

      <div *ngIf="!loading && staff">
        <div class="section" *ngIf="!showManagerPopup && !showUserPopup && !showDeptPopup">
          <h3>Họ và tên</h3>
          <p style="font-size: 1.1rem; margin-top: 8px">
            <strong>{{ staff.name }}</strong>
          </p>
        </div>

        <div class="section popup-mode" *ngIf="showManagerPopup || showUserPopup">
          <div class="section-header">
            <h3>Chọn {{ showManagerPopup ? 'Quản lý' : 'Người dùng' }}</h3>
            <div class="btn-group">
              <button
                class="btn-ok"
                (click)="confirmSelection(showManagerPopup ? 'managers' : 'users')"
              >
                Xác nhận
              </button>
              <button class="btn-cancel" (click)="closeAllPopups()">Hủy</button>
            </div>
          </div>
          <div class="edit-mode-container">
            <div class="filter-bar">
              <input
                type="text"
                [(ngModel)]="searchText"
                placeholder="Tìm kiếm..."
                class="search-box"
                style="flex: 1"
                autofocus
              />
              <label class="select-all-label">
                <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll()" />
                Chọn tất cả
              </label>
            </div>
            <div class="selection-list">
              <div
                class="selection-item"
                *ngFor="let user of filteredUsers"
                (click)="toggleSelection(user.id)"
              >
                <input
                  type="checkbox"
                  [checked]="tempSelectedIds.has(user.id)"
                  (click)="$event.stopPropagation()"
                />
                <span
                  >{{ user.name }} <small>#{{ user.id }}</small></span
                >
              </div>
            </div>
          </div>
        </div>

        <div class="section popup-mode" *ngIf="showDeptPopup">
          <div class="section-header">
            <h3>Chọn phòng ban</h3>
            <div class="btn-group">
              <button class="btn-ok" (click)="confirmSelection('departments')">Xác nhận</button>
              <button class="btn-cancel" (click)="closeAllPopups()">Hủy</button>
            </div>
          </div>
          <div class="edit-mode-container">
            <div class="filter-bar">
              <span style="font-size: 13px; font-weight: bold">Cấu trúc tổ chức</span>
              <label class="select-all-label">
                <input
                  type="checkbox"
                  [checked]="isAllDeptsSelected"
                  (change)="toggleSelectAllDepts()"
                />
                Chọn tất cả cây
              </label>
            </div>
            <div class="tree-wrapper">
              <app-department-tree
                [list]="allDepartments"
                [isSelected]="isSelected"
                [toggleSelection]="toggleSelection"
                [isExpanded]="isExpanded"
                [toggleExpand]="toggleExpand"
              ></app-department-tree>
            </div>
          </div>
        </div>

        <ng-container *ngIf="!showManagerPopup && !showUserPopup && !showDeptPopup">
          <div class="section" *ngFor="let sec of sectionTypes">
            <div class="section-header">
              <h3>{{ sec.label }}</h3>
              <button class="add-btn" (click)="openPopup(sec.popup)">+ Thêm</button>
            </div>
            <div class="data-list">
              <div class="list-item" *ngFor="let item of staff[sec.key]">
                <span>{{ item.name }}</span>
                <span class="remove-icon" (click)="removeItem(sec.key, item.id)">&times;</span>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
