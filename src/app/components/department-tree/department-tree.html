<div *ngFor="let node of list" class="tree-node">
  <div style="display: flex; align-items: center; gap: 4px; padding: 4px 0">
    <!-- quan trọng để khỏi hiện thị dấu expand/collapse khi không có con -->
    <span
      *ngIf="node.children?.length"
      (click)="toggleExpand(node.id); $event.stopPropagation()"
      style="cursor: pointer; width: 20px; text-align: center"
    >
      {{ isExpanded(node.id) ? '▼' : '▶' }}
    </span>
    <span *ngIf="!node.children?.length" style="width: 20px"></span>

    <div
      style="display: flex; align-items: center; flex: 1; cursor: pointer"
      (click)="toggleSelection(node.id)"
    >
      <input
        type="checkbox"
        style="cursor: pointer"
        [checked]="isSelected(node.id)"
        (click)="$event.stopPropagation()"
        (change)="toggleSelection(node.id)"
      />
      <span style="margin: 0 8px">📂</span>
      <span>{{ node.name }}</span>
    </div>
  </div>

  <div
    *ngIf="node.children?.length && isExpanded(node.id)"
    style="margin-left: 20px; border-left: 1px dashed #ccc"
  >
    <app-department-tree
      [list]="node.children"
      [isSelected]="isSelected"
      [toggleSelection]="toggleSelection"
      [isExpanded]="isExpanded"
      [toggleExpand]="toggleExpand"
    ></app-department-tree>
  </div>
</div>
